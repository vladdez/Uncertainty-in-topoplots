project:
  type: website
  output-dir: docs
  execute-dir: project
  # Public copy of the audit site (rendered from reports/ with the "public"
  # profile into audit/); copied to docs/audit on every render. Linked from
  # the home page only, not from the navbar.
  resources:
    - "audit/**"
  render:
    - index.qmd
    - pages/sample.qmd
    - pages/task1.qmd
    - pages/task2.qmd
    - pages/hit_miss.qmd
    - pages/time.qmd
    - pages/subjective.qmd
    - pages/feedback.qmd
    - pages/figures.qmd

execute:
  cache: true

knitr:
  opts_chunk:
    dev: ragg_png
    dpi: 180
    fig-retina: 2

website:
  title: "Uncertainty in topoplots"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: pages/sample.qmd
        text: Sample
      - href: pages/task1.qmd
        text: Task 1
      - href: pages/task2.qmd
        text: Task 2
      - href: pages/hit_miss.qmd
        text: Hit or miss
      - href: pages/time.qmd
        text: Time analysis
      - href: pages/subjective.qmd
        text: Subjective evaluation
      - href: pages/feedback.qmd
        text: Open-ended feedback
      - href: pages/figures.qmd
        text: Publication figures
    right:
      - icon: github
        text: GitHub project
        href: https://github.com/vladdez/Uncertainty-in-topoplots
        target: _blank

format:
  html:
    toc: true
    code-fold: true
    css: styles.css
    include-after-body: _includes/back-to-top.html
    grid:
      body-width: 1200px

editor: visual
