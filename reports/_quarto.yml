# Standalone audit site. Kept separate from the public analysis website.
# Render with `quarto render reports --no-clean` (VS Code task "Render audit
# site (keep open pages)"): pages are overwritten in place, so a browser tab
# that is already open only needs a refresh.
# Output goes to reports/_site (git-ignored); fix-wiki-links.lua keeps the
# literature page's relative links into "The Art of Uncertain Topoplots/llm-wiki"
# working from there.
project:
  type: website
  output-dir: _site
  render:
    - index.md
    - addressed.md
    - fixed.md
    - table-s3-literature-audit.md
    - manuscript-citations-audit.md
    - fixed-citations.md
    - figures-wilke.md
    - fixed-figures.md
    - requested-changes.md

website:
  title: "Audit"
  search: true
  page-navigation: false
  reader-mode: true
  sidebar:
    style: docked
    contents:
      # Back link to the analysis website (absolute, so it works from both the
      # local reports/_site and the public docs/audit copy).
      - href: https://vladdez.github.io/Uncertainty-in-topoplots/
        text: "← Analysis site"
      - section: "Statistical analysis"
        contents:
          - href: index.md
            text: "Unresolved (0)"
          - href: addressed.md
            text: "Addressed (4)"
          - href: fixed.md
            text: "Fixed (31)"
      - section: "Literature"
        contents:
          - href: manuscript-citations-audit.md
            text: "Manuscript citations (21 open)"
          - href: fixed-citations.md
            text: "Fixed citations (29)"
          - href: table-s3-literature-audit.md
            text: "Table S3 rankings"
      - section: "Visualization"
        contents:
          - href: figures-wilke.md
            text: "Figures vs Wilke (1 open)"
          - href: fixed-figures.md
            text: "Fixed figures (26)"
          - href: requested-changes.md
            text: "Requested changes (6)"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    filters:
      - fix-wiki-links.lua
    toc: true
    toc-depth: 2
    toc-location: right
    toc-title: "On this page"
    number-sections: false
    anchor-sections: true
    smooth-scroll: true
    grid:
      body-width: 860px
